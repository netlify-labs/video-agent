[build]
  command = "npm run build"
  publish = "app/web/dist"

[build.environment]
  NODE_VERSION = "24"

# The Deploy to Netlify button asks for these: the agent needs them to make videos, but the build doesn't, so they can
# be skipped and added later (Project configuration > Environment variables, then redeploy). /setup lists any missing.
[template.environment]
  RUNNER_API_TOKEN = "A Netlify personal access token that starts agent runs (ideally from a dedicated account in this team). Required to make videos. You can skip this now and add it later."
  ALLOWED_EMAIL_DOMAINS = "Who can sign up: your company's email domains, comma-separated (e.g. acme.com), or invite-only. Required to make videos. You can skip this now and add it later."
  ADMIN_EMAILS = "The first admins' email addresses, comma-separated. Required to make videos. You can skip this now and add it later."

# Everything else is optional and has a default; set it later under Project configuration > Environment variables.
# The README's Configuration table describes each one:
#   AUTH_PROVIDER (optional)                    identity (default) or netlify: Sign in with Netlify
#   NETLIFY_OAUTH_CLIENT_ID / _SECRET (optional) the OAuth app for Sign in with Netlify (web and MCP)
#   NETLIFY_REQUIRED_TEAM (optional)            only members of these Netlify teams can sign in
#   OPENVERSE_CLIENT_ID / _SECRET (optional)     a registered Openverse app for music search (npm run setup:openverse)
#   ELEVENLABS_API_KEY (optional)               ElevenLabs voices for voice-overs (Kokoro is built in)
#                                               (scope builds; a secret also needs the dev-server context; see docs/guides/deploy.md)
#   BRAND_ZIP_URL (optional)                    your brand kit as a zip, instead of committing it to context/
#   MAX_ACTIVE_RUNS (optional, 3)               runs at once
#   AGENT, AGENT_MODEL, AGENT_EFFORT (optional) which agent makes videos
#   RENDER_QUALITY (optional, standard)         HyperFrames render quality

# The agent skill was called netlify-video until it was split into create-video and video-agent-cli.
[[redirects]]
  from = "/skills/netlify-video.zip"
  to = "/skills/create-video.zip"
  status = 301

# The web app is a single-page app. API, file and share routes are served by functions and edge
# functions, which take precedence over this fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The app may use the microphone (recording voice-over takes), from its own origin only. These headers reach the
# static responses: the SPA and its assets. Share, embed and preview pages are edge-function responses, which deny
# the microphone themselves (app/server/lib/permissions-policy.ts); scripts/e2e/headers.ts checks both live.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "microphone=(self)"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Agent skills (scripts/build.ts): small, rebuilt on every deploy, so browsers and agents recheck often.
[[headers]]
  for = "/skills/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    Access-Control-Allow-Origin = "*"

# Looks (docs/plans/2026-11-04-looks.md §4.3, docs/spikes.md K3): the API function carries the look archives the build
# packed, read at process.cwd()/looks-build/<id>.tar.gz when a version snapshots its look. Only the API needs them.
[functions."api"]
  included_files = ["looks-build/*.tar.gz"]
