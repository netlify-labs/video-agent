<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/va-contract.js"></script>
    <style>
      #root {
        --va-color-bg: #f5f3ef;
        --va-color-text: #1f1d1b;
        --va-color-muted: #6b6560;
        --va-color-accent: #c8452d;
        --va-color-rule: #e2dfda;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f5f3ef; }
      #root { width: 100%; height: 100%; position: relative; font-family: system-ui, sans-serif; background: var(--va-color-bg); color: var(--va-color-text); }
      .beat { position: absolute; inset: 0; }
      [data-va-beat="intro"] { display: grid; place-items: center; }
      [data-va-beat="intro"] .title { font-size: 96px; font-weight: 700; }
      /* bar-chart-race (HyperFrames registry, Apache-2.0), inlined. Names, title, subtitle and source are editable
         text; values, ticks and the period are drawn from the rows' data-values every frame. */
      [data-va-beat="race"] .bcr-head { position: absolute; top: 58px; left: 96px; width: 1728px; display: flex; align-items: flex-start; justify-content: space-between; }
      [data-va-beat="race"] .bcr-title { font-size: 52px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.1; }
      [data-va-beat="race"] .bcr-subtitle { margin-top: 10px; font-size: 30px; color: var(--va-color-muted); }
      [data-va-beat="race"] .bcr-head-right { display: flex; flex-direction: column; align-items: flex-end; }
      [data-va-beat="race"] .bcr-period-caption { font-size: 28px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--va-color-muted); }
      [data-va-beat="race"] .bcr-period { margin-top: 4px; font-size: 72px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; min-height: 72px; }
      [data-va-beat="race"] .bcr-plot { position: absolute; left: 0; top: 256px; width: 1920px; height: 740px; overflow: hidden; }
      [data-va-beat="race"] .bcr-row { position: absolute; left: 0; top: 0; width: 1920px; }
      [data-va-beat="race"] .bcr-name { position: absolute; left: 96px; width: 272px; top: 50%; transform: translateY(-50%); text-align: right; font-size: 30px; font-weight: 600; line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--va-color-bg); }
      [data-va-beat="race"] .bcr-bar { position: absolute; left: 400px; top: 50%; transform: translateY(-50%); border-radius: 3px; background: var(--va-color-text); }
      [data-va-beat="race"] .bcr-row.is-leader .bcr-bar { background: var(--va-color-accent); }
      [data-va-beat="race"] .bcr-value { position: absolute; left: 404px; top: 50%; padding: 0 12px; font-size: 30px; font-weight: 600; line-height: 1.6; font-variant-numeric: tabular-nums; white-space: nowrap; background: var(--va-color-bg); }
      [data-va-beat="race"] .bcr-axis { position: absolute; inset: 0; z-index: 5000; pointer-events: none; }
      [data-va-beat="race"] .bcr-tick-line { position: absolute; top: 252px; left: 0; width: 1px; height: 748px; background: var(--va-color-rule); }
      [data-va-beat="race"] .bcr-tick-label { position: absolute; top: 212px; left: 0; font-size: 28px; font-variant-numeric: tabular-nums; color: var(--va-color-muted); white-space: nowrap; }
      [data-va-beat="race"] .bcr-source { position: absolute; left: 96px; top: 1010px; font-size: 28px; color: var(--va-color-muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-va-contract="1" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <section id="intro" class="clip beat" data-va-beat="intro" data-composition-id="intro" data-start="0" data-duration="3" data-va-authored-duration="3" data-track-index="0">
        <h1 class="title" data-va-text="intro-title">Meet Orbit</h1>
        <script>
          vaBeat('intro', (tl, el) => {
            tl.fromTo(el.querySelector('[data-va-text="intro-title"]'), { y: 12 }, { y: 0, duration: 0.6, ease: 'power3.out' }, 0)
          })
        </script>
      </section>
      <section id="race" class="clip beat" data-va-beat="race" data-va-label="Bar chart race" data-composition-id="race" data-start="3" data-duration="12" data-va-authored-duration="12" data-track-index="0" data-periods="2019,2020,2021,2022,2023,2024" data-value-prefix="$" data-value-suffix="M">
        <div class="bcr-head">
          <div>
            <h2 class="bcr-title" data-va-text="race-title" data-va-label="Title">Orbit workspaces by team</h2>
            <p class="bcr-subtitle" data-va-text="race-subtitle" data-va-label="Subtitle">Ranked by monthly active seats</p>
          </div>
          <div class="bcr-head-right">
            <span class="bcr-period-caption" data-va-text="race-period-caption" data-va-label="Period caption">Year</span>
            <span class="bcr-period"></span>
          </div>
        </div>
        <div class="bcr-plot">
          <div class="bcr-row" data-values="42,58,71,96,118,131">
            <div class="bcr-name" data-layout-allow-overlap data-va-text="race-name-1" data-va-label="Series 1">Northwind</div>
            <div class="bcr-bar"></div>
            <div class="bcr-value" data-layout-allow-overlap></div>
          </div>
          <div class="bcr-row" data-values="30,46,68,92,126,168">
            <div class="bcr-name" data-layout-allow-overlap data-va-text="race-name-2" data-va-label="Series 2">Cobalt</div>
            <div class="bcr-bar"></div>
            <div class="bcr-value" data-layout-allow-overlap></div>
          </div>
          <div class="bcr-row" data-values="55,62,66,70,74,79">
            <div class="bcr-name" data-layout-allow-overlap data-va-text="race-name-3" data-va-label="Series 3">Ferry</div>
            <div class="bcr-bar"></div>
            <div class="bcr-value" data-layout-allow-overlap></div>
          </div>
          <div class="bcr-row" data-values="18,33,52,61,88,104">
            <div class="bcr-name" data-layout-allow-overlap data-va-text="race-name-4" data-va-label="Series 4">Marlow</div>
            <div class="bcr-bar"></div>
            <div class="bcr-value" data-layout-allow-overlap></div>
          </div>
          <div class="bcr-row" data-values="25,28,44,58,63,72">
            <div class="bcr-name" data-layout-allow-overlap data-va-text="race-name-5" data-va-label="Series 5">Aster</div>
            <div class="bcr-bar"></div>
            <div class="bcr-value" data-layout-allow-overlap></div>
          </div>
          <div class="bcr-row" data-values="12,20,39,47,55,90">
            <div class="bcr-name" data-layout-allow-overlap data-va-text="race-name-6" data-va-label="Series 6">Pell</div>
            <div class="bcr-bar"></div>
            <div class="bcr-value" data-layout-allow-overlap></div>
          </div>
          <div class="bcr-row" data-values="8,11,15,24,40,66">
            <div class="bcr-name" data-layout-allow-overlap data-va-text="race-name-7" data-va-label="Series 7">Quill</div>
            <div class="bcr-bar"></div>
            <div class="bcr-value" data-layout-allow-overlap></div>
          </div>
          <div class="bcr-row" data-values="35,37,38,40,42,44">
            <div class="bcr-name" data-layout-allow-overlap data-va-text="race-name-8" data-va-label="Series 8">Dunmore</div>
            <div class="bcr-bar"></div>
            <div class="bcr-value" data-layout-allow-overlap></div>
          </div>
        </div>
        <div class="bcr-axis"><div class="bcr-tick-line"></div><div class="bcr-tick-label"></div><div class="bcr-tick-line"></div><div class="bcr-tick-label"></div><div class="bcr-tick-line"></div><div class="bcr-tick-label"></div><div class="bcr-tick-line"></div><div class="bcr-tick-label"></div><div class="bcr-tick-line"></div><div class="bcr-tick-label"></div><div class="bcr-tick-line"></div><div class="bcr-tick-label"></div><div class="bcr-tick-line"></div><div class="bcr-tick-label"></div><div class="bcr-tick-line"></div><div class="bcr-tick-label"></div><div class="bcr-tick-line"></div><div class="bcr-tick-label"></div><div class="bcr-tick-line"></div><div class="bcr-tick-label"></div><div class="bcr-tick-line"></div><div class="bcr-tick-label"></div><div class="bcr-tick-line"></div><div class="bcr-tick-label"></div></div>
        <p class="bcr-source" data-va-text="race-source" data-va-label="Source">Placeholder data</p>
        <script>
          vaBeat('race', (tl, el) => {
            // The race is a pure function of t (ranks baked at 10 keyframes a period), drawn by a tweened setter so
            // seeking renders the right frame. Data comes from the beat's attributes, not variables.
            const PERIODS = el.dataset.periods.split(',')
            const PREFIX = el.dataset.valuePrefix || ''
            const SUFFIX = el.dataset.valueSuffix || ''
            const rows = [...el.querySelectorAll('.bcr-row')].map((row) => ({
              row,
              bar: row.querySelector('.bcr-bar'),
              value: row.querySelector('.bcr-value'),
              values: row.dataset.values.split(',').map(Number),
            }))
            const periodEl = el.querySelector('.bcr-period')
            const axis = el.querySelector('.bcr-axis')
            const BAR_COUNT = 6, PERIOD = 1.6, K = 10, T = PERIODS.length, N = rows.length
            const KF = PERIOD / K, KF_COUNT = (T - 1) * K + 1, RACE = (T - 1) * PERIOD
            const TRACK_X = 400, TRACK_W = 1180, PITCH = 740 / BAR_COUNT, BAR_H = PITCH * 0.62
            const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v)
            const valueAt = (t, r) => {
              const u = t / PERIOD
              const i = clamp(Math.floor(u), 0, T - 2)
              const f = clamp(u - i, 0, 1)
              return r.values[i] + (r.values[i + 1] - r.values[i]) * f
            }
            const RANKS = []
            for (let m = 0; m < KF_COUNT; m++) {
              const order = rows.map((r, j) => ({ j, v: valueAt(m * KF, r) })).sort((a, b) => b.v - a.v || a.j - b.j)
              const rank = new Array(N)
              order.forEach((o, r) => (rank[o.j] = r))
              RANKS.push(rank)
            }
            const smooth = (x) => x * x * (3 - 2 * x)
            const rankPosAt = (t, j) => {
              const m = t / KF
              const m0 = clamp(Math.floor(m), 0, KF_COUNT - 2)
              const e = smooth(clamp(m - m0, 0, 1))
              return RANKS[m0][j] + (RANKS[m0 + 1][j] - RANKS[m0][j]) * e
            }
            const fmt = (v) => PREFIX + Math.round(v).toLocaleString('en-US') + SUFFIX
            const niceStep = (x) => {
              const e = Math.pow(10, Math.floor(Math.log10(x)))
              const f = x / e
              return e * (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10)
            }
            rows.forEach((r) => {
              r.row.style.height = PITCH + 'px'
              r.bar.style.height = BAR_H + 'px'
            })
            const lines = [...axis.querySelectorAll('.bcr-tick-line')]
            const ticks = [...axis.querySelectorAll('.bcr-tick-label')].map((label, i) => ({ line: lines[i], label }))
            const render = (t) => {
              const values = rows.map((r) => valueAt(t, r))
              const byValue = values.map((_, i) => i).sort((a, b) => values[b] - values[a] || a - b)
              const z = new Array(N)
              byValue.forEach((j, q) => (z[j] = q))
              const leader = byValue[0]
              const scaleMax = Math.max(values[leader] * 1.06, 1e-6)
              const step = niceStep(scaleMax / 4)
              ticks.forEach((tk, i) => {
                const tv = i * step
                const visible = tv <= scaleMax
                const tx = TRACK_X + (tv / scaleMax) * TRACK_W
                tk.line.style.transform = `translateX(${tx.toFixed(2)}px)`
                tk.line.style.opacity = visible ? '1' : '0'
                tk.label.style.transform = `translateX(${tx.toFixed(2)}px) translateX(-50%)`
                tk.label.style.opacity = visible ? '1' : '0'
                tk.label.textContent = visible ? fmt(tv) : ''
              })
              rows.forEach((r, j) => {
                const pos = rankPosAt(t, j)
                const w = (values[j] / scaleMax) * TRACK_W
                r.row.style.transform = `translateY(${(pos * PITCH).toFixed(2)}px)`
                r.row.style.opacity = clamp(BAR_COUNT - pos, 0, 1).toFixed(3)
                r.row.style.zIndex = String(1000 - z[j])
                r.row.classList.toggle('is-leader', j === leader)
                r.bar.style.width = w.toFixed(2) + 'px'
                r.value.style.transform = `translate(${w.toFixed(2)}px, -50%)`
                r.value.textContent = fmt(values[j])
              })
              periodEl.textContent = PERIODS[clamp(Math.floor(t / PERIOD), 0, T - 1)]
            }
            const driver = { _t: 0 }
            Object.defineProperty(driver, 't', { get() { return this._t }, set(v) { this._t = v; render(v) } })
            tl.fromTo(el.querySelector('.bcr-head'), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0)
            tl.fromTo(driver, { t: 0 }, { t: RACE, duration: RACE, ease: 'none' }, 0.5)
            render(0)
          })
        </script>
      </section>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true })
    </script>
  </body>
</html>
