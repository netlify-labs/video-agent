<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/va-contract.js"></script>
    <style>
      #root {
        --va-color-bg: #05070b;
        --va-color-text: #e1e4e8;
        --va-color-muted: #8b98a9;
        --va-color-accent: #58a6ff;
        --va-color-surface: #0b0f17;
        --va-color-keyword: #f97583;
        --va-color-function: #b392f0;
        --va-color-param: #ffab70;
        --va-color-string: #9ecbff;
        --va-color-constant: #79b8ff;
        --va-color-added: #3fb950;
        --va-color-removed: #f85149;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05070b; }
      #root { width: 100%; height: 100%; position: relative; font-family: system-ui, sans-serif; background: var(--va-color-bg); color: var(--va-color-text); }
      .beat { position: absolute; inset: 0; }
      [data-va-beat="intro"] { display: grid; place-items: center; }
      [data-va-beat="intro"] .title { font-size: 96px; font-weight: 700; }
      /* code-diff (HyperFrames registry, Apache-2.0), inlined: the baked Shiki tokens are static spans, one editable
         data-va-text per code line; syntax colours are roles. */
      [data-va-beat="diff"] { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
      [data-va-beat="diff"] .bg-field { position: absolute; inset: 0; background: radial-gradient(1200px 700px at 50% 18%, #0e1726 0%, #070b12 55%, #05070b 100%); }
      [data-va-beat="diff"] .editor { position: absolute; left: 270px; top: 140px; width: 1380px; height: 800px; background: var(--va-color-surface); border: 1px solid #1d2733; border-radius: 16px; box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6); overflow: hidden; display: flex; flex-direction: column; }
      [data-va-beat="diff"] .titlebar { height: 64px; flex: 0 0 64px; display: flex; align-items: center; gap: 16px; padding: 0 22px; background: #0e131c; border-bottom: 1px solid #1b2430; }
      [data-va-beat="diff"] .dots { display: flex; gap: 10px; }
      [data-va-beat="diff"] .dot { width: 14px; height: 14px; border-radius: 50%; background: #3a4452; }
      [data-va-beat="diff"] .filename { font-size: 28px; color: var(--va-color-muted); }
      [data-va-beat="diff"] .code { position: relative; padding: 38px 44px 0 44px; font-size: 30px; line-height: 46px; font-variant-ligatures: none; }
      [data-va-beat="diff"] .diff-line { display: block; height: 46px; line-height: 46px; white-space: pre; overflow: hidden; padding-left: 14px; }
      [data-va-beat="diff"] .diff-sign { display: inline-block; width: 44px; color: var(--va-color-muted); }
      [data-va-beat="diff"] .diff-del { background: rgba(248, 81, 73, 0.12); box-shadow: inset 3px 0 var(--va-color-removed); }
      [data-va-beat="diff"] .diff-add { background: rgba(63, 185, 80, 0.12); box-shadow: inset 3px 0 var(--va-color-added); }
      [data-va-beat="diff"] .diff-del .diff-sign { color: var(--va-color-removed); }
      [data-va-beat="diff"] .diff-add .diff-sign { color: var(--va-color-added); }
      [data-va-beat="diff"] .tok { white-space: pre; }
      [data-va-beat="diff"] .t-plain { color: var(--va-color-text); }
      [data-va-beat="diff"] .t-kw { color: var(--va-color-keyword); }
      [data-va-beat="diff"] .t-fn { color: var(--va-color-function); }
      [data-va-beat="diff"] .t-param { color: var(--va-color-param); }
      [data-va-beat="diff"] .t-str { color: var(--va-color-string); }
      [data-va-beat="diff"] .t-const { color: var(--va-color-constant); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-va-contract="1" data-start="0" data-duration="9" data-width="1920" data-height="1080">
      <section id="intro" class="clip beat" data-va-beat="intro" data-composition-id="intro" data-start="0" data-duration="3" data-va-authored-duration="3" data-track-index="0">
        <h1 class="title" data-va-text="intro-title">Meet Orbit</h1>
        <script>
          vaBeat('intro', (tl, el) => {
            tl.fromTo(el.querySelector('[data-va-text="intro-title"]'), { y: 12 }, { y: 0, duration: 0.6, ease: 'power3.out' }, 0)
          })
        </script>
      </section>
      <section id="diff" class="clip beat" data-va-beat="diff" data-va-label="Code diff" data-composition-id="diff" data-start="3" data-duration="6" data-va-authored-duration="6" data-track-index="0">
        <div class="bg-field" data-layout-ignore></div>
        <div class="editor">
          <div class="titlebar">
            <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            <span class="filename" data-va-text="diff-filename" data-va-label="File name">greet.js</span>
          </div>
          <div class="code-surface">
            <div class="code">
              <div class="diff-line diff-del"><span class="diff-sign">- </span><span class="code-text" data-va-text="diff-line-1" data-va-label="Line 1 (del)"><span class="tok t-kw">function</span><span class="tok t-plain"> </span><span class="tok t-fn">greet</span><span class="tok t-plain">(</span><span class="tok t-param">name</span><span class="tok t-plain">) {</span></span></div>
              <div class="diff-line diff-del"><span class="diff-sign">- </span><span class="code-text" data-va-text="diff-line-2" data-va-label="Line 2 (del)"><span class="tok t-plain">  </span><span class="tok t-plain">console.</span><span class="tok t-fn">log</span><span class="tok t-plain">(</span><span class="tok t-str">&quot;hi &quot;</span><span class="tok t-plain"> </span><span class="tok t-kw">+</span><span class="tok t-plain"> </span><span class="tok t-plain">name)</span></span></div>
              <div class="diff-line diff-add"><span class="diff-sign">+ </span><span class="code-text" data-va-text="diff-line-3" data-va-label="Line 3 (add)"><span class="tok t-kw">function</span><span class="tok t-plain"> </span><span class="tok t-fn">greet</span><span class="tok t-plain">(</span><span class="tok t-param">name</span><span class="tok t-plain">,</span><span class="tok t-plain"> </span><span class="tok t-param">lang</span><span class="tok t-plain">) {</span></span></div>
              <div class="diff-line diff-add"><span class="diff-sign">+ </span><span class="code-text" data-va-text="diff-line-4" data-va-label="Line 4 (add)"><span class="tok t-plain">  </span><span class="tok t-kw">const</span><span class="tok t-plain"> </span><span class="tok t-const">msg</span><span class="tok t-plain"> </span><span class="tok t-kw">=</span><span class="tok t-plain"> </span><span class="tok t-fn">translate</span><span class="tok t-plain">(</span><span class="tok t-str">&quot;hi&quot;</span><span class="tok t-plain">, lang)</span></span></div>
              <div class="diff-line diff-add"><span class="diff-sign">+ </span><span class="code-text" data-va-text="diff-line-5" data-va-label="Line 5 (add)"><span class="tok t-plain">  </span><span class="tok t-plain">console.</span><span class="tok t-fn">log</span><span class="tok t-plain">(</span><span class="tok t-str">`${</span><span class="tok t-plain">msg</span><span class="tok t-str">} ${</span><span class="tok t-plain">name</span><span class="tok t-str">}`</span><span class="tok t-plain">)</span></span></div>
              <div class="diff-line"><span class="diff-sign">  </span><span class="code-text" data-va-text="diff-line-6" data-va-label="Line 6 (same)"><span class="tok t-plain">}</span></span></div>
            </div>
          </div>
        </div>
        <script>
          vaBeat('diff', (tl, el) => {
            // Removed lines collapse, then added lines open, as upstream's diff effect (heights in whole lines).
            const LINE = 46, DEL = 0.55, ADD = 0.6
            tl.fromTo(el.querySelector('.editor'), { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'power2.out' }, 0)
            const atDel = 1.2
            el.querySelectorAll('.diff-del').forEach((line, k) => {
              tl.fromTo(line, { height: LINE, opacity: 1 }, { height: 0, opacity: 0, duration: DEL, ease: 'power2.inOut' }, atDel + k * 0.08)
            })
            const atAdd = atDel + DEL + 0.15
            el.querySelectorAll('.diff-add').forEach((line, k) => {
              tl.fromTo(line, { height: 0, opacity: 0 }, { height: LINE, opacity: 1, duration: ADD, ease: 'power2.out' }, atAdd + k * 0.12)
            })
          })
        </script>
      </section>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true })
    </script>
  </body>
</html>
