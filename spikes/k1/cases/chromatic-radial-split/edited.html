<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/va-contract.js"></script>
    <style>
      #root {
        --va-color-bg: #22223b;
        --va-color-text: #f4f5f7;
        --va-color-accent: #7678ed;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #22223b; }
      #root { width: 100%; height: 100%; position: relative; font-family: system-ui, sans-serif; background: var(--va-color-bg); }
      .beat { position: absolute; inset: 0; overflow: hidden; }
      [data-va-beat="intro"] { display: grid; place-items: center; }
      [data-va-beat="intro"] .title { color: var(--va-color-text); font-size: 96px; font-weight: 700; }
      /* chromatic-radial-split (HyperFrames registry, Apache-2.0), inlined: two DOM panels are drawn into textures
         when the beat is built, then a WebGL shader splits A's RGB channels outward while B's converge. The panels
         stay in the DOM (hidden) so the editor edits their text; the next load redraws the textures. */
      [data-va-beat="split"] .crs-panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      [data-va-beat="split"] .crs-a { background: var(--va-color-bg); }
      [data-va-beat="split"] .crs-b { background: var(--va-color-accent); }
      [data-va-beat="split"] .crs-label { font-size: 140px; font-weight: 800; letter-spacing: 0.02em; }
      [data-va-beat="split"] .crs-a .crs-label { color: var(--va-color-text); }
      [data-va-beat="split"] .crs-b .crs-label { color: var(--va-color-bg); }
      [data-va-beat="split"] .crs-gl { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-va-contract="1" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <section id="intro" class="clip beat" data-va-beat="intro" data-composition-id="intro" data-start="0" data-duration="3" data-va-authored-duration="3" data-track-index="0">
        <h1 class="title" data-va-text="intro-title">Meet Orbit</h1>
        <script>
          vaBeat('intro', (tl, el) => {
            tl.fromTo(el.querySelector('[data-va-text="intro-title"]'), { y: 12 }, { y: 0, duration: 0.6, ease: 'power3.out' }, 0)
          })
        </script>
      </section>
      <section id="split" class="clip beat" data-va-beat="split" data-va-label="Before and after" data-composition-id="split" data-start="3" data-duration="5" data-va-authored-duration="4" data-track-index="0">
        <div class="crs-panel crs-a"><div class="crs-label" data-va-text="split-before" data-va-label="Before">Scattered</div></div>
        <div class="crs-panel crs-b"><div class="crs-label" data-va-text="split-after" data-va-label="After">In one place</div></div>
        <canvas class="crs-gl" width="1920" height="1080"></canvas>
        <canvas class="crs-scratch" width="1920" height="1080" hidden=""></canvas>
        <script>
          vaBeat('split', (tl, el) => {
            const W = 1920
            const H = 1080
            const canvas = el.querySelector('.crs-gl')
            // The beat may not touch document, so the 2D scratch canvas is in its markup.
            const scratch = el.querySelector('.crs-scratch')
            const panels = [...el.querySelectorAll('.crs-panel')]
            const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true })
            if (!gl) {
              // No WebGL: a plain crossfade between the panels.
              canvas.style.display = 'none'
              tl.fromTo(panels[1], { opacity: 0 }, { opacity: 1, duration: 2, ease: 'power1.inOut' }, 1)
              return
            }
            // Draws a panel (its background and its text) into a 2D canvas, the way the block captures its scenes.
            const draw = (panel) => {
              const c = scratch
              const ctx = c.getContext('2d')
              ctx.reset()
              const ps = getComputedStyle(panel)
              ctx.fillStyle = ps.backgroundColor
              ctx.fillRect(0, 0, W, H)
              const pr = panel.getBoundingClientRect()
              for (const t of panel.querySelectorAll('[data-va-text]')) {
                const cs = getComputedStyle(t)
                const r = t.getBoundingClientRect()
                ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`
                ctx.fillStyle = cs.color
                if (cs.letterSpacing !== 'normal') ctx.letterSpacing = cs.letterSpacing
                ctx.textAlign = 'center'
                ctx.textBaseline = 'middle'
                ctx.fillText(t.textContent.trim(), r.left - pr.left + r.width / 2, r.top - pr.top + r.height / 2)
              }
              const tex = gl.createTexture()
              gl.bindTexture(gl.TEXTURE_2D, tex)
              for (const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE)
              for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, p, gl.LINEAR)
              gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c)
              return tex
            }
            const shader = (src, type) => {
              const s = gl.createShader(type)
              gl.shaderSource(s, src)
              gl.compileShader(s)
              return s
            }
            const vert = 'attribute vec2 a_pos;varying vec2 v_uv;void main(){v_uv=a_pos*.5+.5;v_uv.y=1.-v_uv.y;gl_Position=vec4(a_pos,0,1);}'
            const frag =
              'precision mediump float;varying vec2 v_uv;uniform sampler2D u_from,u_to;uniform float u_progress;' +
              'void main(){vec2 c=v_uv-.5;float fs=u_progress*.06;vec3 f=vec3(texture2D(u_from,clamp(v_uv+c*fs,0.,1.)).r,texture2D(u_from,v_uv).g,texture2D(u_from,clamp(v_uv-c*fs,0.,1.)).b);' +
              'float ts=(1.-u_progress)*.06;vec3 t=vec3(texture2D(u_to,clamp(v_uv-c*ts,0.,1.)).r,texture2D(u_to,v_uv).g,texture2D(u_to,clamp(v_uv+c*ts,0.,1.)).b);' +
              'gl_FragColor=vec4(mix(f,t,u_progress),1.);}'
            const prog = gl.createProgram()
            gl.attachShader(prog, shader(vert, gl.VERTEX_SHADER))
            gl.attachShader(prog, shader(frag, gl.FRAGMENT_SHADER))
            gl.linkProgram(prog)
            gl.useProgram(prog)
            const buf = gl.createBuffer()
            gl.bindBuffer(gl.ARRAY_BUFFER, buf)
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW)
            const pos = gl.getAttribLocation(prog, 'a_pos')
            gl.enableVertexAttribArray(pos)
            gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0)
            gl.viewport(0, 0, W, H)
            const [from, to] = panels.map(draw)
            gl.uniform1i(gl.getUniformLocation(prog, 'u_from'), 0)
            gl.uniform1i(gl.getUniformLocation(prog, 'u_to'), 1)
            const uProgress = gl.getUniformLocation(prog, 'u_progress')
            const render = (p) => {
              gl.activeTexture(gl.TEXTURE0)
              gl.bindTexture(gl.TEXTURE_2D, from)
              gl.activeTexture(gl.TEXTURE1)
              gl.bindTexture(gl.TEXTURE_2D, to)
              gl.uniform1f(uProgress, p)
              gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)
            }
            for (const p of panels) p.style.opacity = '0'
            // Seek-safe: the shader's progress is a tweened value, redrawn on every update (authored seconds 1–3).
            const state = { p: 0 }
            render(0)
            tl.fromTo(state, { p: 0 }, { p: 1, duration: 2, ease: 'power1.inOut', onUpdate: () => render(state.p) }, 1)
              .set({}, {}, 4)
          })
        </script>
      </section>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true })
    </script>
  

</body></html>
