<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>host</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      #preview {
        width: 960px;
        height: 540px;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <iframe id="preview" sandbox="allow-scripts" title="Preview"></iframe>
    <iframe id="attacker" src="/app/attacker.html" style="width: 10px; height: 10px; border: 0"></iframe>
    <script>
      // Host bridge (the app): one channel per preview; accept only that iframe's window and known shapes.
      const frame = document.getElementById('preview')
      window.__fromPreview = []
      window.__rejected = 0
      let channel = ''
      let lastTime = 0
      let resumeAt = null
      const ALLOWED = { ready: 1, time: 1, click: 1, error: 1, 'edits-applied': 1, probe: 1 }
      window.addEventListener('message', (e) => {
        const m = e.data
        if (e.source !== frame.contentWindow || !m || m.channel !== channel || !ALLOWED[m.type]) {
          window.__rejected++
          return
        }
        if (m.type === 'time' && typeof m.time === 'number') lastTime = m.time
        if (m.type === 'ready' && resumeAt !== null) {
          send({ type: 'seek', time: resumeAt })
          resumeAt = null
        }
        window.__fromPreview.push(m)
      })
      function send(m) {
        frame.contentWindow.postMessage(Object.assign({ channel }, m), '*')
      }
      window.__send = send
      window.__sendRaw = (m) => frame.contentWindow.postMessage(m, '*')
      window.__lastTime = () => lastTime
      async function load(keep) {
        const { cap } = await (await fetch('/app/cap')).json()
        channel = crypto.randomUUID()
        if (keep) resumeAt = lastTime
        frame.src = '/preview/' + cap + '/index.html#ch=' + channel
        window.__cap = cap
      }
      // Renew the capability before it expires without losing the playhead.
      window.__renew = () => load(true)
      load(false)
    </script>
  </body>
</html>
