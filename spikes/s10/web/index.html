<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S10 sync harness</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #111;
        --muted: #666;
        --line: #ccc;
        --accent: #2b6cb0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111;
          --fg: #eee;
          --muted: #999;
          --line: #333;
          --accent: #63b3ed;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        font:
          14px/1.4 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        margin: 8px 0;
      }
      fieldset {
        border: 1px solid var(--line);
        border-radius: 6px;
        margin: 8px 0;
      }
      legend {
        color: var(--muted);
      }
      video {
        width: 480px;
        max-width: 100%;
        background: #000;
        display: block;
      }
      button {
        font: inherit;
        padding: 4px 10px;
      }
      #status {
        font-weight: 600;
      }
      pre {
        background: color-mix(in srgb, var(--fg) 6%, transparent);
        padding: 8px;
        overflow: auto;
        max-height: 40vh;
        font-size: 12px;
      }
      table {
        border-collapse: collapse;
        font-size: 12px;
      }
      td,
      th {
        border: 1px solid var(--line);
        padding: 2px 6px;
        text-align: left;
        vertical-align: top;
      }
      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>S10 browser sync + capture harness</h1>
    <p class="muted">
      Spike only: muted picture with rVFC anchors, stem monitor in one AudioContext, AudioWorklet -&gt; Worker
      capture (24 kHz PCM16, streaming hash, peaks, IndexedDB), fit, loopback measurement, calibration. See
      spikes/s10/CHECKLIST.md.
    </p>

    <fieldset>
      <legend>Setup</legend>
      <div class="row">
        <label
          >Setup label <input id="label" size="40" placeholder="chrome / builtin-mic / speakers"
        /></label>
        <label
          >Mode
          <select id="mode">
            <option value="loopback">loopback (speakers -&gt; mic)</option>
            <option value="headphones">headphones (no loopback)</option>
            <option value="fake">fake mic (automation)</option>
          </select></label
        >
        <label
          >Input
          <select id="device">
            <option value="">default</option>
          </select></label
        >
      </div>
      <div class="row">
        <label><input type="checkbox" id="ec" /> echoCancellation</label>
        <label><input type="checkbox" id="ns" /> noiseSuppression</label>
        <label><input type="checkbox" id="agc" /> autoGainControl</label>
        <label
          >Residual stop (ms) <input id="threshold" type="number" value="10" step="1" style="width: 5em"
        /></label>
        <label
          >Slope tolerance (ppm) <input id="slope" type="number" value="1000" step="50" style="width: 6em"
        /></label>
        <label><input type="checkbox" id="mr" checked /> MediaRecorder comparison</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Run</legend>
      <div class="row">
        <button id="bMatrix">API matrix</button>
        <button id="bTake30">Take 30 s</button>
        <button id="bTake600">Take 10 min</button>
        <button id="bStop">Stop</button>
        <span id="status">idle</span>
      </div>
      <div class="row">
        <button id="bCalA">Calibrate (a) speaker loopback</button>
        <button id="bCalB">Calibrate (b) clap on flash (8)</button>
        <label
          >(c) manual offset <input id="manual" type="range" min="-300" max="300" value="0" step="1" />
          <output id="manualOut">0</output> ms</label
        >
      </div>
      <div class="row">
        <button id="bAudition">Audition memory (32 x 10 min, 200 MB)</button>
        <button id="bRecover">List recoverable takes</button>
        <button id="bClear">Clear IndexedDB</button>
        <button id="bDownload">Download last report</button>
      </div>
    </fieldset>

    <div class="row" style="align-items: flex-start">
      <video id="video" muted playsinline preload="auto"></video>
      <div id="calib" class="muted"></div>
    </div>
    <div id="matrix"></div>
    <pre id="log"></pre>
    <script type="module" src="/web/page.js"></script>
  </body>
</html>
