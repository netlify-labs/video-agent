<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/va-contract.js"></script>
    <style>
      /* Neutral starting point in editing contract v1 (see AGENTS.md). Agents replace this whole file for each
         video, following context/, and keep the contract: beats, data-va-text ids, --va-color-<role> colours. */
      #root {
        --va-color-bg: #0b0d10;
        --va-color-text: #f4f5f7;
        --va-color-muted: #9aa3ad;
        --va-color-accent: #14b8a6;
        --font-display: 'Inter', system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0d10; }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font-display); background: var(--va-color-bg); }
      .beat { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
      .kicker { color: var(--va-color-accent); font-size: 28px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; }
      .title { color: var(--va-color-text); font-size: 96px; font-weight: 700; letter-spacing: -0.03em; margin-top: 16px; }
      .sub { color: var(--va-color-muted); font-size: 36px; margin-top: 20px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-va-contract="1" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="intro" class="clip beat" data-va-beat="intro" data-composition-id="intro" data-start="0" data-duration="5" data-va-authored-duration="5" data-track-index="0">
        <div>
          <div class="kicker" data-va-text="intro-kicker">Video Agent</div>
          <h1 class="title" data-va-text="intro-title">Your video goes here</h1>
          <p class="sub" data-va-text="intro-sub">Replace this composition for each request.</p>
        </div>
        <script>
          vaBeat('intro', (tl, el) => {
            tl.fromTo(el.querySelector('[data-va-text="intro-kicker"]'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.2)
              .fromTo(el.querySelector('[data-va-text="intro-title"]'), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.35)
              .fromTo(el.querySelector('[data-va-text="intro-sub"]'), { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.7)
          })
        </script>
      </section>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true })
    </script>
  </body>
</html>
