<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Neutral starting point. Agents replace this whole file for each video, following context/. */
      :root {
        --ground: #0b0d10;
        --ink: #f4f5f7;
        --muted: #9aa3ad;
        --accent: #14b8a6;
        --font-display: 'Inter', system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; display: grid; place-items: center; font-family: var(--font-display); }
      #stack { text-align: center; }
      #kicker { color: var(--accent); font-size: 28px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; }
      #title { color: var(--ink); font-size: 96px; font-weight: 700; letter-spacing: -0.03em; margin-top: 16px; }
      #sub { color: var(--muted); font-size: 36px; margin-top: 20px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="stack" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="kicker">Video Agent</div>
        <h1 id="title">Your video goes here</h1>
        <p id="sub">Replace this composition for each request.</p>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#kicker', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.2)
        .fromTo('#title', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.35)
        .fromTo('#sub', { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.7);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
