<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/va-contract.js"></script>
    <style>
      /* The example for this look: the fictional product Orbit, placeholder words. Runs reuse its structure and
         building blocks, never its words or media. Colours are the brand's roles, written as literal colours. */
      #root {
        --va-color-bg: #0b0d10;
        --va-color-text: #f4f5f7;
        --va-color-accent: #14b8a6;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0d10; }
      #root { width: 100%; height: 100%; position: relative; font-family: system-ui, sans-serif; background: var(--va-color-bg); }
      .beat { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
      .kicker { color: var(--va-color-accent); font-size: 28px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; }
      .title { color: var(--va-color-text); font-size: 96px; font-weight: 700; letter-spacing: -0.03em; margin-top: 16px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-va-contract="1" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <section id="intro" class="clip beat" data-va-beat="intro" data-composition-id="intro" data-start="0" data-duration="3" data-va-authored-duration="3" data-track-index="0">
        <div>
          <div class="kicker" data-va-text="intro-kicker">Introducing</div>
          <h1 class="title" data-va-text="intro-title">Meet Orbit</h1>
        </div>
        <script>
          vaBeat('intro', (tl, el) => {
            tl.fromTo(el.querySelector('[data-va-text="intro-kicker"]'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.1)
              .fromTo(el.querySelector('[data-va-text="intro-title"]'), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.3)
          })
        </script>
      </section>
      <section id="feature" class="clip beat" data-va-beat="feature" data-composition-id="feature" data-start="3" data-duration="4" data-va-authored-duration="4" data-track-index="0">
        <div>
          <div class="kicker" data-va-text="feature-kicker">One home</div>
          <h2 class="title" data-va-text="feature-title">Everything in one place</h2>
        </div>
        <script>
          vaBeat('feature', (tl, el) => {
            tl.fromTo(el.querySelector('[data-va-text="feature-kicker"]'), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.1)
              .fromTo(el.querySelector('[data-va-text="feature-title"]'), { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'power2.out' }, 0.3)
          })
        </script>
      </section>
      <section id="cta" class="clip beat" data-va-beat="cta" data-composition-id="cta" data-start="7" data-duration="3" data-va-authored-duration="3" data-track-index="0">
        <div>
          <h2 class="title" data-va-text="cta-title">Try Orbit today</h2>
          <div class="kicker" data-va-text="cta-url">orbit.example</div>
        </div>
        <script>
          vaBeat('cta', (tl, el) => {
            tl.fromTo(el.querySelector('[data-va-text="cta-title"]'), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.3)
              .fromTo(el.querySelector('[data-va-text="cta-url"]'), { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.8)
          })
        </script>
      </section>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true })
    </script>
  </body>
</html>
