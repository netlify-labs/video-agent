# Spike A2: a hello-world JavaScript action at a sub-folder, to test installing
# `uses: netlify-labs/video-agent/spikes/a/hello-action@<sha>` from another repo.
# The real action will live at packages/action; the path doesn't change what A2 measures.
name: Video Agent spike A2
description: Prints its inputs and the runner's Node version. Spends nothing.
inputs:
  greeting:
    description: Any text.
    default: hello
outputs:
  node:
    description: The Node version the action ran on.
runs:
  using: node24
  main: dist/index.cjs
