<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/va-contract.js"></script>
    <style>
      #root {
        --va-color-bg: #0b0d10;
        --va-color-text: #f4f5f7;
        --va-color-accent: #f12c2c;
        --va-color-scene: #2a3442;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0d10; }
      #root { width: 100%; height: 100%; position: relative; font-family: system-ui, sans-serif; background: var(--va-color-bg); }
      .beat { position: absolute; inset: 0; overflow: hidden; }
      [data-va-beat="intro"] { display: grid; place-items: center; }
      [data-va-beat="intro"] .title { color: var(--va-color-text); font-size: 96px; font-weight: 700; }
      [data-va-beat="footage"] { background: radial-gradient(circle at 60% 40%, var(--va-color-scene), var(--va-color-bg) 75%); }
      [data-va-beat="footage"] .headline { position: absolute; inset: 0; display: grid; place-items: center; color: var(--va-color-text); font-size: 88px; font-weight: 700; }
      /* camcorder-hud (HyperFrames registry, Apache-2.0), inlined: CSS scoped to the beat, the HUD colour is the text
         role and the record dot the accent role. */
      [data-va-beat="footage"] .ch-hud { position: absolute; inset: 0; color: var(--va-color-text); font-family: ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 40px; font-weight: 700; line-height: 1.25; pointer-events: none; -webkit-text-stroke: 1.3px rgb(0 0 0 / 92%); text-shadow: 0 2px 6px rgb(0 0 0 / 90%); }
      [data-va-beat="footage"] .ch-corner { position: absolute; }
      [data-va-beat="footage"] .ch-record { top: 54px; left: 54px; display: flex; align-items: center; gap: 19px; }
      [data-va-beat="footage"] .ch-record-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--va-color-accent); box-shadow: 0 0 10px color-mix(in srgb, var(--va-color-accent) 55%, transparent); }
      [data-va-beat="footage"] .ch-battery { top: 54px; right: 54px; width: 76px; height: 38px; border: 4px solid currentcolor; }
      [data-va-beat="footage"] .ch-battery::before { position: absolute; top: 7px; left: 7px; width: 51px; height: 15px; background: currentcolor; content: ''; }
      [data-va-beat="footage"] .ch-battery::after { position: absolute; top: 7px; right: -11px; width: 8px; height: 15px; background: currentcolor; content: ''; }
      [data-va-beat="footage"] .ch-date { bottom: 54px; left: 54px; }
      [data-va-beat="footage"] .ch-counter { right: 54px; bottom: 54px; text-align: right; }
      [data-va-beat="footage"] .ch-mode { display: block; margin-bottom: 8px; font-size: 28px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-va-contract="1" data-start="0" data-duration="9" data-width="1920" data-height="1080">
      <section id="intro" class="clip beat" data-va-beat="intro" data-composition-id="intro" data-start="0" data-duration="3" data-va-authored-duration="3" data-track-index="0">
        <h1 class="title" data-va-text="intro-title">Meet Orbit</h1>
        <script>
          vaBeat('intro', (tl, el) => {
            tl.fromTo(el.querySelector('[data-va-text="intro-title"]'), { y: 12 }, { y: 0, duration: 0.6, ease: 'power3.out' }, 0)
          })
        </script>
      </section>
      <section id="footage" class="clip beat" data-va-beat="footage" data-va-label="Behind the scenes" data-composition-id="footage" data-start="3" data-duration="6" data-va-authored-duration="4" data-track-index="0">
        <h2 class="headline" data-va-text="footage-headline" data-va-label="Headline">Day one at Orbit</h2>
        <div class="ch-hud" aria-hidden="true">
          <div class="ch-corner ch-record"><span class="ch-record-dot"></span><span data-va-text="footage-rec" data-va-label="Record label">REC</span></div>
          <div class="ch-corner ch-battery"></div>
          <div class="ch-corner ch-date">
            <div data-va-text="footage-date" data-va-label="Date">NOV 05 2026</div>
            <div data-va-text="footage-time" data-va-label="Time">12:00 AM</div>
          </div>
          <div class="ch-corner ch-counter">
            <span class="ch-mode" data-va-text="footage-mode" data-va-label="Mode">SP · 16:9</span><span class="ch-counter-value"></span>
          </div>
        </div>
        <script>
          vaBeat('footage', (tl, el) => {
            const counter = el.querySelector('.ch-counter-value')
            const dot = el.querySelector('.ch-record-dot')
            // The counter shows real seconds of the beat: the inner timeline runs in authored time, so scale by
            // data-duration / data-va-authored-duration (a retimed beat still counts its own length).
            const scale = Number(el.dataset.duration) / Number(el.dataset.vaAuthoredDuration)
            const state = { seconds: 0 }
            const pad = (n) => String(n).padStart(2, '0')
            const update = () => {
              const s = Math.max(0, Math.floor(state.seconds * scale))
              counter.textContent = [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map(pad).join(':')
              dot.style.opacity = Math.floor((state.seconds * scale) / 0.55) % 2 === 0 ? '1' : '0.25'
            }
            tl.fromTo(state, { seconds: 0 }, { seconds: 4, duration: 4, ease: 'none', onUpdate: update }, 0)
            update()
          })
        </script>
      </section>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true })
    </script>
  

</body></html>
