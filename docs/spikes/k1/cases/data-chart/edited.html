<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/va-contract.js"></script>
    <style>
      #root {
        --va-color-bg: #faf9f6;
        --va-color-text: #333333;
        --va-color-muted: #666666;
        --va-color-accent: #326fa8;
        --va-color-bar: #5c5c5c;
        --va-color-rule: #e8e8e8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #faf9f6; }
      #root { width: 100%; height: 100%; position: relative; font-family: system-ui, sans-serif; background: var(--va-color-bg); }
      .beat { position: absolute; inset: 0; }
      [data-va-beat="intro"] { display: grid; place-items: center; }
      [data-va-beat="intro"] .title { color: var(--va-color-text); font-size: 96px; font-weight: 700; }
      /* data-chart (HyperFrames registry, Apache-2.0), inlined: static SVG (labels are editable text), CSS scoped to the beat. */
      [data-va-beat="chart"] { display: flex; justify-content: center; align-items: center; color: var(--va-color-text); }
      [data-va-beat="chart"] .chart-container { width: 1680px; height: 960px; display: flex; flex-direction: column; position: relative; }
      [data-va-beat="chart"] .header { margin-bottom: 24px; }
      [data-va-beat="chart"] .headline { font-family: Georgia, "Times New Roman", serif; font-size: 60px; white-space: nowrap; }
      [data-va-beat="chart"] .subtitle { font-size: 32px; color: var(--va-color-muted); margin: 10px 0 18px; white-space: nowrap; }
      [data-va-beat="chart"] .key { display: flex; gap: 36px; }
      [data-va-beat="chart"] .key-item { display: flex; align-items: center; gap: 12px; }
      [data-va-beat="chart"] .key-box { width: 18px; height: 18px; background: var(--va-color-bar); }
      [data-va-beat="chart"] .key-line { width: 28px; height: 3px; background: var(--va-color-accent); }
      [data-va-beat="chart"] .key-text { font-size: 28px; color: var(--va-color-muted); }
      [data-va-beat="chart"] .chart-svg { width: 100%; height: 640px; overflow: visible; }
      [data-va-beat="chart"] .source { position: absolute; bottom: 0; left: 0; font-size: 28px; color: var(--va-color-muted); }
      [data-va-beat="chart"] .grid-line { stroke: var(--va-color-rule); stroke-width: 1px; }
      [data-va-beat="chart"] .baseline { stroke: var(--va-color-text); stroke-width: 1.5px; }
      [data-va-beat="chart"] .axis-label { font-size: 31px; fill: var(--va-color-muted); text-anchor: middle; }
      [data-va-beat="chart"] .bar { fill: var(--va-color-bar); }
      [data-va-beat="chart"] .bar-label { font-size: 31px; fill: var(--va-color-text); text-anchor: middle; }
      [data-va-beat="chart"] .line-label { font-size: 31px; fill: var(--va-color-accent); font-weight: 600; text-anchor: middle; }
      [data-va-beat="chart"] .conversion-path { fill: none; stroke: var(--va-color-accent); stroke-width: 3; }
      [data-va-beat="chart"] .line-dot { fill: var(--va-color-accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-va-contract="1" data-start="0" data-duration="11" data-width="1920" data-height="1080">
      <section id="intro" class="clip beat" data-va-beat="intro" data-composition-id="intro" data-start="0" data-duration="3" data-va-authored-duration="3" data-track-index="0">
        <h1 class="title" data-va-text="intro-title">Meet Orbit</h1>
        <script>
          vaBeat('intro', (tl, el) => {
            tl.fromTo(el.querySelector('[data-va-text="intro-title"]'), { y: 12 }, { y: 0, duration: 0.6, ease: 'power3.out' }, 0)
          })
        </script>
      </section>
      <section id="chart" class="clip beat" data-va-beat="chart" data-va-label="Revenue chart" data-composition-id="chart" data-start="3" data-duration="8" data-va-authored-duration="10" data-track-index="0">
        <div class="chart-container">
          <div class="header">
            <h2 class="headline" data-va-text="chart-title" data-va-label="Chart title">Quarterly revenue vs. signups</h2>
            <p class="subtitle" data-va-text="chart-subtitle" data-va-label="Subtitle">Jan–Jun, in thousands</p>
            <div class="key">
              <div class="key-item"><div class="key-box"></div><span class="key-text" data-va-text="chart-key-bars" data-va-label="Bars key">Revenue</span></div>
              <div class="key-item"><div class="key-line"></div><span class="key-text" data-va-text="chart-key-line" data-va-label="Line key">Conversion rate</span></div>
            </div>
          </div>
          <svg class="chart-svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid meet">
            <g class="gridlines">
            <line class="grid-line" x1="100" y1="500" x2="1500" y2="500"></line>
            <line class="grid-line" x1="100" y1="400" x2="1500" y2="400"></line>
            <line class="grid-line" x1="100" y1="300" x2="1500" y2="300"></line>
            <line class="grid-line" x1="100" y1="200" x2="1500" y2="200"></line>
            <line class="grid-line" x1="100" y1="100" x2="1500" y2="100"></line>
            </g>
            <g class="x-axis-labels">
            <text class="axis-label" x="271.4" y="644" data-va-text="chart-month-1" data-va-label="Month 1">Jan</text>
            <text class="axis-label" x="482.9" y="644" data-va-text="chart-month-2" data-va-label="Month 2">Feb</text>
            <text class="axis-label" x="694.3" y="644" data-va-text="chart-month-3" data-va-label="Month 3">Mar</text>
            <text class="axis-label" x="905.7" y="644" data-va-text="chart-month-4" data-va-label="Month 4">Apr</text>
            <text class="axis-label" x="1117.1" y="644" data-va-text="chart-month-5" data-va-label="Month 5">May</text>
            <text class="axis-label" x="1328.6" y="644" data-va-text="chart-month-6" data-va-label="Month 6">Jun</text>
            </g>
            <g class="bars-group">
            <rect class="bar" x="231.4" y="440" width="80" height="160"></rect>
            <rect class="bar" x="442.9" y="360" width="80" height="240"></rect>
            <rect class="bar" x="654.3" y="300" width="80" height="300"></rect>
            <rect class="bar" x="865.7" y="380" width="80" height="220"></rect>
            <rect class="bar" x="1077.1" y="240" width="80" height="360"></rect>
            <rect class="bar" x="1288.6" y="160" width="80" height="440"></rect>
            </g>
            <g class="bar-labels-group">
            <text class="bar-label" x="271.4" y="426" data-va-text="chart-bar-1" data-va-label="Bar value 1">$8K</text>
            <text class="bar-label" x="482.9" y="346" data-va-text="chart-bar-2" data-va-label="Bar value 2">$12K</text>
            <text class="bar-label" x="694.3" y="286" data-va-text="chart-bar-3" data-va-label="Bar value 3">$15K</text>
            <text class="bar-label" x="905.7" y="366" data-va-text="chart-bar-4" data-va-label="Bar value 4">$11K</text>
            <text class="bar-label" x="1117.1" y="226" data-va-text="chart-bar-5" data-va-label="Bar value 5">$18K</text>
            <text class="bar-label" x="1328.6" y="146" data-va-text="chart-bar-6" data-va-label="Bar value 6">$31K</text>
            </g>
            <path class="conversion-path" pathLength="1" d="M 271.4,390.0 L 482.9,320.0 L 694.3,280.0 L 905.7,310.0 L 1117.1,220.0 L 1328.6,180.0"></path>
            <circle class="line-dot" r="7" cx="271.4" cy="390.0"></circle>
            <g class="line-labels-group">
            <text class="line-label" x="271.4" y="370.0" data-va-text="chart-rate-1" data-va-label="Rate 1">2.1%</text>
            <text class="line-label" x="482.9" y="300.0" data-va-text="chart-rate-2" data-va-label="Rate 2">2.8%</text>
            <text class="line-label" x="694.3" y="260.0" data-va-text="chart-rate-3" data-va-label="Rate 3">3.2%</text>
            <text class="line-label" x="905.7" y="290.0" data-va-text="chart-rate-4" data-va-label="Rate 4">2.9%</text>
            <text class="line-label" x="1117.1" y="200.0" data-va-text="chart-rate-5" data-va-label="Rate 5">3.8%</text>
            <text class="line-label" x="1328.6" y="160.0" data-va-text="chart-rate-6" data-va-label="Rate 6">4.2%</text>
            </g>
            <line class="baseline" x1="100" y1="600" x2="1500" y2="600"></line>
          </svg>
          <div class="source" data-va-text="chart-source" data-va-label="Source">Source: Orbit internal analytics</div>
        </div>
        <script>
          vaBeat('chart', (tl, el) => {
            const q = (s) => el.querySelector(s)
            const all = (s) => [...el.querySelectorAll(s)]
            const points = [[271.4, 390.0], [482.9, 320.0], [694.3, 280.0], [905.7, 310.0], [1117.1, 220.0], [1328.6, 180.0]]
            tl.fromTo(q('.headline'), { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 1.2, ease: 'power1.inOut' }, 0)
              .fromTo(q('.subtitle'), { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 1.2, ease: 'power1.inOut' }, 0.2)
              .fromTo(q('.key'), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 1.0)
              .fromTo(all('.grid-line'), { opacity: 0 }, { opacity: 1, duration: 0.5, stagger: 0.25, ease: 'power2.out' }, 0.5)
            // Bars grow from the baseline (their final geometry is in the markup); value labels follow.
            all('.bar').forEach((bar, i) => {
              const t = 1.5 + i * 0.5
              tl.fromTo(bar, { scaleY: 0, transformOrigin: '50% 100%' }, { scaleY: 1, duration: 0.8, ease: 'power2.out' }, t)
              tl.fromTo(all('.bar-label')[i], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, t + 0.8)
            })
            // The line draws itself and the dot rides it; the rate labels fade in as it passes (no counting text,
            // which would overwrite the editable labels).
            const lineStart = 4.5
            const seg = 3 / (points.length - 1)
            tl.fromTo(q('.conversion-path'), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 3, ease: 'none' }, lineStart)
            tl.fromTo(q('.line-dot'), { opacity: 0 }, { opacity: 1, duration: 0.01 }, lineStart)
            points.forEach(([x, y], i) => {
              if (i > 0) tl.to(q('.line-dot'), { attr: { cx: x, cy: y }, duration: seg, ease: 'none' }, lineStart + (i - 1) * seg)
              tl.fromTo(all('.line-label')[i], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, lineStart + i * seg + 0.2)
            })
            tl.fromTo(q('.source'), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 6.6)
          })
        </script>
      </section>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true })
    </script>
  

</body></html>
