<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/va-contract.js"></script>
    <style>
      #root {
        --va-color-bg: #0b0d10;
        --va-color-text: #f4f5f7;
        --va-color-accent: #ffae69;
        --va-color-flash: #fffdfa;
        --va-color-cool: #b7daff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0d10; }
      #root { width: 100%; height: 100%; position: relative; font-family: system-ui, sans-serif; background: var(--va-color-bg); }
      .beat { position: absolute; inset: 0; overflow: hidden; }
      [data-va-beat="intro"] { display: grid; place-items: center; }
      [data-va-beat="intro"] .title { color: var(--va-color-text); font-size: 96px; font-weight: 700; }
      [data-va-beat="reveal"] .headline { position: absolute; inset: 0; display: grid; place-items: center; color: var(--va-color-text); font-size: 110px; font-weight: 800; letter-spacing: -0.02em; }
      /* editorial-flash-overlay (HyperFrames registry, Apache-2.0), inlined: CSS scoped to the beat; the flash is
         colour roles (flash = the wash, accent = warm, cool) instead of hard-coded rgb tokens. */
      [data-va-beat="reveal"] .ef-flash { position: absolute; inset: -12%; overflow: hidden; pointer-events: none; }
      [data-va-beat="reveal"] .ef-layer { position: absolute; inset: 0; opacity: 0; }
      [data-va-beat="reveal"] .ef-wash { background: var(--va-color-flash); }
      [data-va-beat="reveal"] .ef-core {
        inset: -18%;
        background: radial-gradient(ellipse 68% 92% at 37% 47%, #ffffff 0%, #ffffff 20%, var(--va-color-flash) 45%, color-mix(in srgb, var(--va-color-accent) 32%, transparent) 67%, transparent 86%);
        mix-blend-mode: screen;
        transform-origin: 38% 48%;
      }
      [data-va-beat="reveal"] .ef-sweep {
        inset: -28%;
        background: linear-gradient(108deg, transparent 21%, color-mix(in srgb, var(--va-color-accent) 10%, transparent) 38%, var(--va-color-flash) 49%, #ffffff 53%, color-mix(in srgb, var(--va-color-cool) 24%, transparent) 62%, transparent 79%);
        mix-blend-mode: screen;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-va-contract="1" data-start="0" data-duration="7" data-width="1920" data-height="1080">
      <section id="intro" class="clip beat" data-va-beat="intro" data-composition-id="intro" data-start="0" data-duration="3" data-va-authored-duration="3" data-track-index="0">
        <h1 class="title" data-va-text="intro-title">Meet Orbit</h1>
        <script>
          vaBeat('intro', (tl, el) => {
            tl.fromTo(el.querySelector('[data-va-text="intro-title"]'), { y: 12 }, { y: 0, duration: 0.6, ease: 'power3.out' }, 0)
          })
        </script>
      </section>
      <section id="reveal" class="clip beat" data-va-beat="reveal" data-va-label="Reveal" data-composition-id="reveal" data-start="3" data-duration="4" data-va-authored-duration="4" data-track-index="0">
        <h2 class="headline" data-va-text="reveal-headline" data-va-label="Headline">Everything in one place</h2>
        <div class="ef-flash" aria-hidden="true" data-layout-allow-overflow>
          <div class="ef-layer ef-wash"></div>
          <div class="ef-layer ef-core" data-layout-allow-overflow></div>
          <div class="ef-layer ef-sweep" data-layout-allow-overflow></div>
        </div>
        <script>
          vaBeat('reveal', (tl, el) => {
            const headline = el.querySelector('[data-va-text="reveal-headline"]')
            const wash = el.querySelector('.ef-wash')
            const core = el.querySelector('.ef-core')
            const sweep = el.querySelector('.ef-sweep')
            // Used as the transition into this beat: the flash hits early (upstream hits at 58% of a standalone
            // overlay) and the headline swaps in under it. Authored time; a retime stretches the whole timeline.
            const hit = 0.6
            tl.fromTo(headline, { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0)
              .set(headline, { opacity: 1 }, hit + 0.03)
              .fromTo(wash, { opacity: 0 }, { opacity: 0.92, duration: 0.04, ease: 'power4.in' }, hit)
              .fromTo(core, { opacity: 0, scale: 0.86, rotation: -5 }, { opacity: 1, scale: 1, rotation: -5, duration: 0.05, ease: 'power4.in' }, hit - 0.01)
              .fromTo(sweep, { opacity: 0, xPercent: -12, rotation: -2 }, { opacity: 0.9, xPercent: 8, rotation: -2, duration: 0.04, ease: 'power4.in' }, hit)
              .to(wash, { opacity: 0, duration: 0.18, ease: 'power3.out' }, hit + 0.04)
              .to(core, { opacity: 0, scale: 1.18, rotation: -5, duration: 0.34, ease: 'power2.out' }, hit + 0.04)
              .to(sweep, { opacity: 0, xPercent: 28, rotation: -2, duration: 0.3, ease: 'power2.out' }, hit + 0.04)
          })
        </script>
      </section>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true })
    </script>
  </body>
</html>
