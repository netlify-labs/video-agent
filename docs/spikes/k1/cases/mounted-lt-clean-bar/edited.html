<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/va-contract.js"></script>
    <style>
      #root {
        --va-color-bg: #0b0d10;
        --va-color-text: #f4f5f7;
        --va-color-accent: #ff5a36;
        --va-color-surface: #ffffff;
        --va-color-ink: #0f1115;
        --va-color-muted: #5a6170;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0d10; }
      #root { width: 100%; height: 100%; position: relative; font-family: system-ui, sans-serif; background: var(--va-color-bg); }
      .beat { position: absolute; inset: 0; }
      [data-va-beat="intro"] { display: grid; place-items: center; }
      [data-va-beat="intro"] .title { color: var(--va-color-text); font-size: 96px; font-weight: 700; }
      /* lt-clean-bar (HyperFrames registry, Apache-2.0), inlined: CSS scoped to the beat. */
      [data-va-beat="speaker"] .lt { position: absolute; left: 120px; bottom: 110px; display: flex; align-items: stretch; border-radius: 16px; overflow: hidden; box-shadow: 0 14px 44px rgba(15, 17, 21, 0.18); }
      [data-va-beat="speaker"] .lt-tab { width: 12px; background: var(--va-color-accent); flex-shrink: 0; }
      [data-va-beat="speaker"] .lt-body { background: var(--va-color-surface); padding: 22px 40px 24px 30px; display: flex; flex-direction: column; gap: 7px; }
      [data-va-beat="speaker"] .lt-name { font-size: 52px; font-weight: 700; color: var(--va-color-ink); line-height: 1.06; letter-spacing: -0.015em; white-space: nowrap; }
      [data-va-beat="speaker"] .lt-role { font-size: 28px; color: var(--va-color-muted); line-height: 1.2; letter-spacing: 0.01em; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-va-contract="1" data-start="0" data-duration="6.6" data-width="1920" data-height="1080">
      <section id="intro" class="clip beat" data-va-beat="intro" data-composition-id="intro" data-start="0" data-duration="3" data-va-authored-duration="3" data-track-index="0">
        <h1 class="title" data-va-text="intro-title">Meet Orbit 2</h1>
        <script>
          vaBeat('intro', (tl, el) => {
            tl.fromTo(el.querySelector('[data-va-text="intro-title"]'), { y: 12 }, { y: 0, duration: 0.6, ease: 'power3.out' }, 0)
          })
        </script>
      </section>
      <section id="speaker" class="clip beat" data-va-beat="speaker" data-va-label="Speaker" data-composition-id="speaker" data-start="3" data-duration="3.6" data-va-authored-duration="4.8" data-track-index="0">
        <div id="lt-mount" data-composition-id="lt-clean-bar" data-composition-src="compositions/lt-clean-bar.html" data-start="0" data-duration="4.8" data-track-index="1" data-width="1920" data-height="1080"></div>
        <script>
          vaBeat('speaker', (tl, el) => {})
        </script>
      </section>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true })
    </script>
  

</body></html>
