<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/va-contract.js"></script>
    <script src="vendor/va-recording.js"></script>
    <style>
      #root {
        --va-color-bg: #0b0d10;
        --va-color-text: #f4f5f7;
        --va-color-muted: #9aa3ad;
        --va-color-accent: #14b8a6;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--va-color-bg, #0b0d10); }
      #root { width: 100%; height: 100%; position: relative; font-family: system-ui, sans-serif; background: var(--va-color-bg); }
      .beat { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
      .title { color: var(--va-color-text); font-size: 96px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-va-contract="1" data-start="0" data-duration="12.5" data-width="1920" data-height="1080">
      <section id="intro" class="clip beat" data-va-beat="intro" data-composition-id="intro" data-start="0" data-duration="2.5" data-va-authored-duration="2.5" data-track-index="0">
        <h1 class="title" data-va-text="intro-title">Deploy in a minute</h1>
        <script>
          vaBeat('intro', (tl, el) => {
            tl.from(el.querySelector('[data-va-text="intro-title"]'), { opacity: 0, y: 24, duration: 0.6 }, 0.2)
          })
        </script>
      </section>

      <section id="add-site" class="clip beat" data-va-beat="add-site" data-va-label="Add a site" data-composition-id="add-site" data-start="2.5" data-duration="7.5" data-va-authored-duration="7.5" data-track-index="0">
        <script src="assets/recording/redact.js"></script>
        <script src="assets/recording/add-site.cursor.js"></script>
        <div class="va-recording" data-va-recording="add-site" data-va-frame="wallpaper">
          <div class="va-stage" data-va-camera='[[2,0.5,0.5,1],[3.4,0.6,0.31,1.9,"power2.inOut"],[10.9,0.6,0.31,1.9],[12,0.5,0.5,1,"power2.inOut"]]'>
            <video id="rec-add-site" data-va-media="add-site-screen" data-va-kind="video" data-va-label="Screen" src="assets/media/med_rec.mp4" data-va-in="2" data-va-out="12" data-media-start="2" data-playback-rate="1.3333" muted data-start="0" data-duration="7.5"></video>
            <div class="va-cursor" data-va-cursor="smooth" data-va-path="add-site"></div>
            <div class="va-clicks" data-va-clicks='[[4,0.611,0.304]]'></div>
            <div class="va-redact" data-va-redact='[]' data-va-locked="assets/recording/redact.js"></div>
          </div>
        </div>
        <p data-va-text="add-site-callout" data-va-label="Callout">Click <b>Add new site</b></p>
        <script>
          vaBeat('add-site', (tl, el) => {
            vaRecording(tl, el)
            tl.from(el.querySelector('[data-va-text="add-site-callout"]'), { opacity: 0, y: 12, duration: 0.4 }, 0.6)
          })
        </script>
      </section>

      <section id="outro" class="clip beat" data-va-beat="outro" data-composition-id="outro" data-start="10" data-duration="2.5" data-va-authored-duration="2.5" data-track-index="0">
        <h2 class="title" data-va-text="outro-cta">Try it free</h2>
        <script>
          vaBeat('outro', (tl, el) => {
            tl.from(el.querySelector('[data-va-text="outro-cta"]'), { opacity: 0, scale: 0.96, duration: 0.6 }, 0.2)
          })
        </script>
      </section>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true })
    </script>
  </body>
</html>
