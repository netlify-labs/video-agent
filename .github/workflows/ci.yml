name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Run it on any branch by hand: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    # Usually 30-35 minutes; a hang fails the run instead of holding a runner for GitHub's 6 hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The feedback-still tests run ffmpeg/ffprobe, as prepare-run does inside runs.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: npm run build:packages
      - run: npm test
      - run: npm run openapi:check
      - run: npm run action:check
      - run: npm run db:check
      - run: npm run build:ui
      - run: npx playwright install --with-deps chromium
      # Looks: the static checks and each example through hyperframes check (needs the Chromium above). Runs on
      # pull_request only, never pull_request_target, so contributed examples run with no secrets.
      - run: npm run look:check
      # Usually about 20 minutes (playwright.config.ts also stops the suite at 30 in CI).
      - run: npm run test:ui
        timeout-minutes: 35
      # Traces and screenshots of failed specs (playwright.config.ts keeps them on failure).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # The built SDK on each Node it supports (cli-and-sdk plan §4.5 Runtime): import and require(), a call over a stub
  # fetch, a webhook signature, and a main entry with no node: imports but the lazy file helpers'.
  sdk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:packages
      - run: node scripts/sdk-smoke.mjs

  # Breaking-change check on the REST API (cli-and-sdk plan §4.4): /api/v1 is additive, and the SDK relies on it.
  # v1 only warns. From the SDK's 1.0 this becomes blocking unless the PR has the `api-breaking` label and a
  # changeset with a major SDK bump.
  api-breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OASDIFF_VERSION: 1.35.0
      OASDIFF_SHA256: a8023002fcb2eaa7f5758148a9303cb63d33b939886df312268bc0fc7b939140
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install oasdiff (pinned, checksum verified)
        run: |
          curl -fsSL -o oasdiff.tar.gz "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  oasdiff.tar.gz" | sha256sum -c -
          tar xzf oasdiff.tar.gz oasdiff
      - name: Compare the spec with its base (warnings only)
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git show "$base:ui/src/api/openapi.json" > base.json 2>/dev/null; then
            echo "No base spec at ${base:-?}; nothing to compare."
            exit 0
          fi
          echo "oasdiff ${OASDIFF_VERSION}: breaking ${base} -> ${GITHUB_SHA}"
          ./oasdiff breaking base.json ui/src/api/openapi.json --format githubactions | sed 's/^::error /::warning /' || true
          {
            echo "### Breaking API changes (oasdiff ${OASDIFF_VERSION}, warning only in v1)"
            echo '```'
            ./oasdiff breaking base.json ui/src/api/openapi.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Local mode end to end on the packed CLI with the fixture agent (cli-and-sdk plan §7; beads va-p1th.5.15, 5.17):
  # npm pack, install the tarball, `video-agent local --agent fixture` then `local revise` (offline). The real runtime
  # install, agent-kit, render broker and done.json handoff run; only the agent is a fixture. Guards against the
  # bundled runtime drifting from the repo's scripts.
  local-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/local-fixture-e2e.ts

  # Phase 0 spikes C1 and C3 on Linux (cli-and-sdk plan §11), run by hand only:
  # gh workflow run ci.yml --ref <branch>. Local renders and a Python venv; no credits.
  spikes-linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Local renders and a Python venv: longer than the other jobs.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg python3-venv
      - run: npm ci --ignore-scripts
      - name: C1 online, then offline
        run: |
          npx tsx spikes/c1/c1.ts --cache "$RUNNER_TEMP/c1" | tee c1-online.jsonl
          npx tsx spikes/c1/c1.ts --cache "$RUNNER_TEMP/c1" --offline | tee c1-offline.jsonl
      - name: C3
        if: matrix.node == 24
        run: npx tsx spikes/c3/c3.ts --cache "$RUNNER_TEMP/c3" | tee c3.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spikes-linux-node${{ matrix.node }}
          path: '*.jsonl'
          retention-days: 7
