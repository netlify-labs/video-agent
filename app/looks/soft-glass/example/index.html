<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/va-contract.js"></script>
    <style>
      /* Soft glass example: the fictional product Orbit, placeholder words. Runs reuse the panels, the cursor and
         the entrances, never the words. Colours are the brand's roles and the derived haze and glass, as literals. */
      #root {
        --va-color-bg: #fbfcfe;
        --va-color-text: #14213d;
        --va-color-muted: #5b6780;
        --va-color-accent: #2f6bff;
        --va-color-haze: #c5d6ff;
        --va-color-glass: rgba(255, 255, 255, 0.55);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fbfcfe; }
      #root { width: 100%; height: 100%; position: relative; font-family: system-ui, sans-serif; background: var(--va-color-bg); color: var(--va-color-text); }
      .beat { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(1150px 820px at 22% 14%, var(--va-color-haze), transparent 70%), radial-gradient(1150px 820px at 82% 90%, var(--va-color-haze), transparent 70%), var(--va-color-bg); }
      .glass { position: absolute; background: var(--va-color-glass); backdrop-filter: blur(24px); border: 1.5px solid rgba(255, 255, 255, 0.7); border-radius: 32px; box-shadow: 0 30px 80px rgba(16, 24, 40, 0.14); }
      .head { font-size: 80px; font-weight: 600; line-height: 1.08; letter-spacing: -0.025em; }
      .title { font-size: 44px; font-weight: 600; letter-spacing: -0.01em; }
      .body { font-size: 34px; line-height: 1.4; color: var(--va-color-muted); }
      .btn { position: absolute; height: 84px; padding: 0 44px; border-radius: 42px; background: var(--va-color-accent); color: var(--va-color-bg); font-size: 34px; font-weight: 600; display: flex; align-items: center; }
      .mark { width: 72px; height: 72px; border-radius: 20px; background: var(--va-color-accent); }
      .cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; z-index: 5; }
      .field { position: absolute; height: 96px; border-radius: 48px; display: flex; align-items: center; padding: 0 44px; font-size: 38px; font-weight: 500; }
      .under { position: absolute; height: 10px; border-radius: 5px; background: var(--va-color-accent); transform-origin: left center; }
      .centre { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-va-contract="1" data-start="0" data-duration="12.5" data-width="1920" data-height="1080">
      <section id="intro" class="clip beat" data-va-beat="intro" data-va-label="Intro" data-composition-id="intro" data-start="0" data-duration="3" data-va-authored-duration="3" data-track-index="0">
        <div class="glass" style="left: 410px; top: 250px; width: 1100px; height: 580px; padding: 64px 72px">
          <div style="display: flex; align-items: center; gap: 24px">
            <div class="mark"></div>
            <p class="title" data-va-text="intro-name" data-va-label="Product name">Orbit</p>
          </div>
          <h1 class="head" style="margin-top: 56px" data-va-text="intro-title" data-va-label="Headline">Ask your team's notes anything</h1>
          <div class="btn" style="left: 72px; bottom: 64px" data-va-text="intro-button" data-va-label="Button">Ask Orbit</div>
        </div>
        <svg class="cursor" viewBox="0 0 44 44"><path d="M8 4 L8 34 L16 27 L22 40 L28 37 L22 25 L33 25 Z" fill="#14213d" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" /></svg>
        <script>
          vaBeat('intro', (tl, el) => {
            const cursor = el.querySelector('.cursor')
            const btn = el.querySelector('.btn')
            // The panel is in place at 0 s (the first frame is the thumbnail) and settles; the cursor glides in and presses the button.
            tl.fromTo(el.querySelector('.glass'), { y: 40 }, { y: 0, duration: 0.8, ease: 'expo.out' }, 0)
              .fromTo(cursor, { x: 1500, y: 980 }, { x: 600, y: 730, duration: 0.8, ease: 'power3.inOut' }, 1)
              .to(cursor, { scale: 0.86, duration: 0.08 }, 1.9)
              .to(cursor, { scale: 1, duration: 0.15 }, 1.98)
              .fromTo(btn, { scale: 1 }, { scale: 0.96, duration: 0.08 }, 1.95)
              .to(btn, { scale: 1, duration: 0.3, ease: 'power2.out' }, 2.03)
          })
        </script>
      </section>
      <section id="ask" class="clip beat" data-va-beat="ask" data-va-label="Ask" data-composition-id="ask" data-start="3" data-duration="4" data-va-authored-duration="4" data-track-index="0">
        <div class="glass field" style="left: 460px; top: 180px; width: 1000px; transform-origin: 14% 100%">
          <span data-va-text="ask-query" data-va-label="Question">Where is the Q3 roadmap?</span>
        </div>
        <div class="glass" style="left: 460px; top: 340px; width: 1000px; height: 440px; padding: 56px 64px">
          <p class="title" data-va-text="ask-title" data-va-label="Answer title">Q3 roadmap</p>
          <p class="body" style="margin-top: 24px" data-va-text="ask-body" data-va-label="Answer">Updated yesterday by the product team.</p>
          <p class="body" style="margin-top: 8px; color: var(--va-color-text); font-weight: 600" data-va-text="ask-key" data-va-label="Key phrase">Search ships in September</p>
          <div class="under" style="left: 64px; top: 248px; width: 430px"></div>
        </div>
        <svg class="cursor" viewBox="0 0 44 44"><path d="M8 4 L8 34 L16 27 L22 40 L28 37 L22 25 L33 25 Z" fill="#14213d" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" /></svg>
        <script>
          vaBeat('ask', (tl, el) => {
            const panels = el.querySelectorAll('.glass')
            // The field springs out of where the button was pressed; the question types; the answer arrives already moving.
            tl.set(el.querySelector('.cursor'), { x: 600, y: 730 }, 0)
              .fromTo(panels[0], { scale: 0.9, filter: 'blur(14px)' }, { scale: 1, filter: 'blur(0px)', duration: 0.55, ease: 'back.out(1.3)' }, 0)
              .fromTo(el.querySelector('[data-va-text="ask-query"]'), { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.9, ease: 'steps(24)' }, 0.5)
              .to(el.querySelector('.cursor'), { x: 1560, y: 860, duration: 0.8, ease: 'power3.inOut' }, 0.4)
              .fromTo(panels[1], { y: 54, filter: 'blur(14px)', opacity: 0 }, { y: 0, filter: 'blur(0px)', opacity: 1, duration: 0.8, ease: 'expo.out' }, 1.6)
              .fromTo(el.querySelector('.under'), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: 'power2.out' }, 2.5)
              .to(panels[1], { scale: 1.03, duration: 1.5, ease: 'none' }, 2.5)
          })
        </script>
      </section>
      <section id="cards" class="clip beat" data-va-beat="cards" data-va-label="Features" data-composition-id="cards" data-start="7" data-duration="2.5" data-va-authored-duration="2.5" data-track-index="0">
        <h2 class="head" style="position: absolute; left: 150px; top: 380px; width: 720px" data-va-text="cards-title" data-va-label="Headline">Notes, tasks and docs, all answered</h2>
        <div class="glass" style="left: 980px; top: 220px; width: 640px; height: 300px; padding: 52px 56px">
          <p class="title" data-va-text="cards-a" data-va-label="Feature 1">Search</p>
          <p class="body" style="margin-top: 16px" data-va-text="cards-a-sub" data-va-label="Feature 1 line">Every page your team wrote</p>
        </div>
        <div class="glass" style="left: 1100px; top: 470px; width: 640px; height: 300px; padding: 52px 56px">
          <p class="title" data-va-text="cards-b" data-va-label="Feature 2">Share</p>
          <p class="body" style="margin-top: 16px" data-va-text="cards-b-sub" data-va-label="Feature 2 line">Send an answer with its source</p>
        </div>
        <script>
          vaBeat('cards', (tl, el) => {
            // The one whip of the video: the scene lands from the right, then the cards settle one after the other.
            tl.fromTo(el.querySelector('[data-va-text="cards-title"]'), { x: 130, filter: 'blur(24px)' }, { x: 0, filter: 'blur(0px)', duration: 0.4, ease: 'expo.out' }, 0)
              .fromTo(el.querySelectorAll('.glass'), { x: 130, filter: 'blur(14px)', opacity: 0 }, { x: 0, filter: 'blur(0px)', opacity: 1, duration: 0.8, ease: 'expo.out', stagger: 0.15 }, 0.1)
          })
        </script>
      </section>
      <section id="end" class="clip beat" data-va-beat="end" data-va-label="End card" data-composition-id="end" data-start="9.5" data-duration="3" data-va-authored-duration="3" data-track-index="0">
        <div class="centre">
          <div class="glass" style="position: relative; padding: 72px 120px; display: grid; justify-items: center">
            <div class="mark" style="width: 96px; height: 96px; border-radius: 28px"></div>
            <h2 class="head" style="font-size: 130px; margin-top: 28px" data-va-text="end-title" data-va-label="Product name">Orbit</h2>
            <div class="btn" style="position: relative; margin-top: 40px" data-va-text="end-cta" data-va-label="Call to action">Try Orbit free</div>
          </div>
        </div>
        <script>
          vaBeat('end', (tl, el) => {
            tl.fromTo(el.querySelector('.glass'), { y: 54, filter: 'blur(14px)', opacity: 0 }, { y: 0, filter: 'blur(0px)', opacity: 1, duration: 0.9, ease: 'expo.out' }, 0)
              .fromTo(el.querySelector('.btn'), { scale: 0.9 }, { scale: 1, duration: 0.55, ease: 'back.out(1.3)' }, 0.5)
          })
        </script>
      </section>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true })
    </script>
  </body>
</html>
