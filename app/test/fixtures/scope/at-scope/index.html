<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, height=360" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/va-contract.js"></script>
    <style>
      #root { --va-color-bg: #000000; --va-color-text: #ffffff; --va-color-accent: #14b8a6; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 640px; height: 360px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; position: relative; background: var(--va-color-bg); }
      .beat { position: absolute; inset: 0; }
      /* Every scene and the root layer have a .card; unstyled, it's white. */
      .card { position: absolute; left: 220px; top: 100px; width: 200px; height: 160px; background: rgb(255, 255, 255); }
      .strip { position: absolute; left: 0; top: 0; width: 640px; height: 40px; }
      .strip .card { left: 0; top: 0; width: 640px; height: 40px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-va-contract="1" data-start="0" data-duration="3" data-width="640" data-height="360">
      <div id="strip" class="clip strip" data-va-layer="strip" data-start="0" data-duration="3" data-track-index="1"><div class="card"></div></div>

      <section id="one" class="clip beat" data-va-beat="one" data-va-label="Unstyled" data-composition-id="one" data-start="0" data-duration="1" data-va-authored-duration="1" data-track-index="0">
        <div class="card"></div>
        <script>
          vaBeat('one', (tl, el) => {
            tl.set(el, { opacity: 1 }, 0)
          })
        </script>
      </section>

      <section id="two" class="clip beat" data-va-beat="two" data-va-label="Prelude-less @scope" data-composition-id="two" data-start="1" data-duration="1" data-va-authored-duration="1" data-track-index="0">
        <style>
          @scope {
            .card { background: rgb(255, 0, 0); }
          }
        </style>
        <div class="card"></div>
        <script>
          vaBeat('two', (tl, el) => {
            tl.set(el, { opacity: 1 }, 0)
          })
        </script>
      </section>

      <section id="three" class="clip beat" data-va-beat="three" data-va-label="Prelude @scope" data-composition-id="three" data-start="2" data-duration="1" data-va-authored-duration="1" data-track-index="0">
        <style>
          @scope ([data-va-beat="three"]) {
            .card { background: rgb(0, 0, 255); }
          }
        </style>
        <div class="card"></div>
        <script>
          vaBeat('three', (tl, el) => {
            tl.set(el, { opacity: 1 }, 0)
          })
        </script>
      </section>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true })
    </script>
  </body>
</html>
