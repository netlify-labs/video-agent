<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/va-contract.js"></script>
    <script src="vendor/va-recording.js"></script>
    <style>
      #root { --va-color-bg: #0b0d10; --va-color-text: #f4f5f7; --va-color-muted: #9aa3ad; --va-color-accent: #14b8a6; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0d10; }
      #root { width: 100%; height: 100%; position: relative; }
      .clip { position: absolute; inset: 0; }
      .va-stage > video { background: #334155; }
    </style>
  </head>
  <body>
    <!-- Runtime fixture for vendor/va-recording.js (va-rsk5.3.8): the scenes are laid on top of each other; tests seek
         one beat's timeline at a time and hide the other. -->
    <div id="root" data-composition-id="main" data-va-contract="1" data-start="0" data-duration="13.5" data-width="1920" data-height="1080">
      <section id="add-site" class="clip" data-va-beat="add-site" data-composition-id="add-site" data-start="0" data-duration="7.5" data-va-authored-duration="7.5" data-track-index="0">
        <script src="assets/recording/redact.js"></script>
        <script src="assets/recording/add-site.cursor.js"></script>
        <div class="va-recording" data-va-recording="add-site" data-va-frame="FRAME">
          <div class="va-stage" data-va-camera='CAMERA'>
            <video id="rec-add-site" data-va-media="add-site-screen" data-va-kind="video" src="assets/media/med_rec.mp4" data-va-in="2" data-va-out="12" data-media-start="2" data-playback-rate="1.3333" muted data-start="0" data-duration="7.5"></video>
            <div class="va-cursor" data-va-cursor="smooth" data-va-path="add-site"></div>
            <div class="va-clicks" data-va-clicks='CLICKS'></div>
            <div class="va-redact" data-va-redact='REDACT' data-va-locked="assets/recording/redact.js"></div>
          </div>
        </div>
        <script>
          vaBeat('add-site', (tl, el) => {
            vaRecording(tl, el)
          })
        </script>
      </section>

      <section id="held" class="clip" data-va-beat="held" data-composition-id="held" data-start="7.5" data-duration="6" data-va-authored-duration="6" data-track-index="0">
        <div class="va-recording" data-va-recording="held" data-va-frame="none">
          <div class="va-stage" data-va-camera='[[3,0.5,0.5,1],[5,0.5,0.5,1]]'>
            <video id="rec-held" data-va-media="held-screen" data-va-kind="video" src="assets/media/med_rec.mp4" data-va-in="3" data-va-out="5" data-media-start="3" data-playback-rate="0.5" muted data-start="0" data-duration="4" data-va-rec-hold="end"></video>
            <img class="va-rec-hold" src="assets/recording/held.hold.jpg" alt="">
            <div class="va-cursor" data-va-cursor="none"></div>
            <div class="va-clicks" data-va-clicks='[]'></div>
            <div class="va-redact" data-va-redact='[]' data-va-locked="assets/recording/redact.js"></div>
          </div>
        </div>
        <script>
          vaBeat('held', (tl, el) => {
            vaRecording(tl, el)
          })
        </script>
      </section>
    </div>
  </body>
</html>
