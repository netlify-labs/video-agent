<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; background: #0b0d10; color: #f4f5f7; font-family: system-ui, sans-serif; }
      #title { position: absolute; left: 160px; top: 380px; font-size: 120px; margin: 0; }
      #sub { position: absolute; left: 160px; top: 560px; font-size: 48px; color: #9aa3ad; margin: 0; }
    </style>
  </head>
  <body>
    <h1 id="title" data-va-text="intro-title">Org webhooks</h1>
    <p id="sub" data-va-text="outro-cta">Read the docs</p>
    <script>
      // Mock stand-in for a composition with the real bridge protocol (app/server/preview/bridge.js).
      const channel = new URLSearchParams(location.hash.slice(1)).get('ch')
      const post = (m) => parent.postMessage(Object.assign({ channel }, m), '*')
      let t = 0
      let timer = null
      const duration = 8
      window.addEventListener('message', (e) => {
        const m = e.data
        if (e.source !== parent || !m || m.channel !== channel) return
        if (m.type === 'play' && !timer) timer = setInterval(() => { t = Math.min(duration, t + 0.1); post({ type: 'time', time: t }) }, 100)
        if (m.type === 'pause') { clearInterval(timer); timer = null }
        if (m.type === 'seek') { t = m.time; post({ type: 'time', time: t }) }
        if (m.type === 'apply-edits') {
          for (const ed of m.edits) { const el = document.querySelector('[data-va-text="' + CSS.escape(ed.id) + '"]') || document.getElementById(ed.id); if (el) el.textContent = ed.text }
          post({ type: 'edits-applied', count: m.edits.length })
        }
      })
      document.addEventListener('click', (ev) => {
        const el = ev.target.closest("[data-va-text]") || ev.target.closest("[id]")
        post({ type: 'click', x: ev.clientX / innerWidth, y: ev.clientY / innerHeight, textId: el ? (el.getAttribute("data-va-text") || el.id) : null })
      })
      setTimeout(() => post({ type: 'ready', duration }), 50)
    </script>
  </body>
</html>
