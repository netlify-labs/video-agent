# gitleaks (scripts/public-snapshot.ts runs `gitleaks dir`): the default rules, minus the fake secrets tests use.
[extend]
useDefault = true

[allowlist]
description = "Fake secrets in tests"
regexes = [
  '''rm_sec_AbC-123_x''', # scripts/lib/run-tools.test.ts: a made-up runner key for the masking test
  '''9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08''', # app/test/privacy-patterns.test.ts: sha256("test")
]
