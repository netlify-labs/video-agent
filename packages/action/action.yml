# The Video Agent GitHub Action (docs/plans/2026-11-04-github-action.md). Inputs and outputs mirror src/spec.ts;
# test/spec.test.ts keeps them in step. Pin it to a full commit SHA: uses: netlify-labs/video-agent/packages/action@<sha>
name: Video Agent
description: Make a demo video for a labelled pull request or a release, post it in one sticky comment, and take /video commands.
author: Netlify
branding:
  icon: film
  color: blue
inputs:
  url:
    description: 'The Video Agent site, e.g. https://acme-video.netlify.app. Store it as an org-level variable, not a secret (a secret would mask every link the action prints).'
    required: false
  api-key:
    description: 'An nva_ API key from a secret, for a CI account with the Creator role.'
    required: false
  target:
    description: 'pr/<number> or release/<tag>: what the video is for, when the event does not say (workflow_dispatch, the step after a release tool).'
    required: false
  prompt:
    description: 'Extra instructions added to the brief. With no PR or release target (workflow_dispatch), the whole brief.'
    required: false
  base-video:
    description: 'A video id (vid_…) to remix instead of creating from scratch.'
    required: false
  aspect:
    description: '16:9, 9:16, 1:1 or 4:5.'
    required: false
    default: '16:9'
  duration:
    description: 'Target length in seconds. Default: 30 for a PR, 45 for a release.'
    required: false
  look:
    description: 'A look id, sent only when the server lists looks in its features.'
    required: false
  label:
    description: 'The PR label that asks for a video, and that new commits and commands require. Empty: no label needed.'
    required: false
    default: 'video'
  on-push:
    description: 'ignore, or revise: update the video when the PR gets new commits.'
    required: false
    default: 'ignore'
  max-versions:
    description: 'Versions the action may make per PR or release.'
    required: false
    default: '3'
  max-runs-per-day:
    description: "Runs (new videos, revisions, remixes, retries) this account may start in 24 hours, counted from the server's video list."
    required: false
    default: '10'
  max-credits-per-month:
    description: "Optional. Start nothing when this month's run credits (GET /api/v1/me/usage) are at or above it."
    required: false
  screenshots:
    description: 'none, body (images in the PR description), or a glob of workspace files (video-shots/*.png).'
    required: false
    default: 'body'
  publish:
    description: 'Publish the ready version so the comment shows the GIF and a public link.'
    required: false
    default: 'false'
  private:
    description: 'Make the video private in the app. Refused together with publish.'
    required: false
    default: 'false'
  timeout-minutes:
    description: 'How long to wait for the video. 0: start it and return at once.'
    required: false
    default: '30'
  release-asset:
    description: 'Attach video.mp4 and captions.vtt to the release. On a public repo this needs publish: true.'
    required: false
    default: 'false'
  trust:
    description: 'members: people must have write access to the repo, no fork PRs. forks: also commands on fork PRs, from members.'
    required: false
    default: 'members'
  dry-run:
    description: 'Build and print the brief and the calls it would make; spend and change nothing.'
    required: false
    default: 'false'
  github-token:
    description: 'For comments, reactions and releases.'
    required: false
    default: '${{ github.token }}'
outputs:
  video-id:
    description: 'The video (vid_…).'
  version:
    description: 'The version this run made or followed.'
  status:
    description: 'ready, failed, timed_out, cancelled, running (still making it), skipped, refused, limited, dry_run or none.'
  web-url:
    description: 'The video in the app (needs a sign-in).'
  share-url:
    description: 'The public share page, when published.'
  mp4-url:
    description: 'The public MP4, when published.'
  gif-url:
    description: 'The public preview GIF, when published.'
  poster-url:
    description: 'The public poster, when published.'
  duration-sec:
    description: 'The video length in seconds, when ready.'
  credits:
    description: 'Credits the version cost (at least this much for unfinished attempts).'
  comment-id:
    description: 'The sticky PR comment.'
  created:
    description: 'true when this run made a new video or version.'
  prompt:
    description: 'The brief that was sent.'
runs:
  using: node24
  main: dist/index.cjs
